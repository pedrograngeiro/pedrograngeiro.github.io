settings:
  content:
    merge: true

media:
  input: public/images/articles
  output: /images/articles
  rename: true
  categories:
    - image
  extensions:
    - jpg
    - jpeg
    - png
    - webp
    - avif
    - gif

content:
  - name: blog
    label: Artigos
    type: collection
    path: src/content/blog
    format: yaml-frontmatter
    filename:
      template: "{primary}.md"
      field: create
    view:
      primary: title
      fields:
        - title
        - publishedAt
        - draft
        - featured
      sort:
        - publishedAt
        - title
      search:
        - title
        - description
        - tags
      default:
        sort: publishedAt
        order: desc
    fields:
      - name: title
        label: Título
        type: string
        required: true
        options:
          maxlength: 160
      - name: description
        label: Descrição
        type: text
        required: true
        description: Resumo usado na listagem e nos metadados da página.
        options:
          minlength: 20
          maxlength: 280
      - name: publishedAt
        label: Data de publicação
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: updatedAt
        label: Última atualização
        type: date
        default: ""
        options:
          format: yyyy-MM-dd
      - name: tags
        label: Tags
        type: string
        list: true
      - name: draft
        label: Rascunho
        type: boolean
        default: true
        description: Enquanto estiver ativo, a publicação não aparece no site.
      - name: featured
        label: Publicação em destaque
        type: boolean
        default: false
      - name: body
        label: Conteúdo
        type: rich-text
        required: true
        options:
          format: markdown
          switcher: true

  - name: blog_mdx
    label: Artigos avançados (MDX)
    type: collection
    path: src/content/blog
    format: yaml-frontmatter
    filename:
      template: "{primary}.mdx"
      field: create
    exclude:
      - modelo-artigo.mdx
    view:
      primary: title
      fields:
        - title
        - publishedAt
        - draft
        - featured
      sort:
        - publishedAt
        - title
      search:
        - title
        - description
        - tags
      default:
        sort: publishedAt
        order: desc
    fields:
      - name: title
        label: Título
        type: string
        required: true
        options:
          maxlength: 160
      - name: description
        label: Descrição
        type: text
        required: true
        options:
          minlength: 20
          maxlength: 280
      - name: publishedAt
        label: Data de publicação
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: updatedAt
        label: Última atualização
        type: date
        default: ""
        options:
          format: yyyy-MM-dd
      - name: tags
        label: Tags
        type: string
        list: true
      - name: draft
        label: Rascunho
        type: boolean
        default: true
      - name: featured
        label: Publicação em destaque
        type: boolean
        default: false
      - name: body
        label: Conteúdo MDX
        type: code
        required: true
        description: Preserve imports, componentes Astro e expressões MDX.
        options:
          format: mdx

  - name: projects
    label: Projetos
    type: collection
    path: src/content/projects
    format: yaml-frontmatter
    filename:
      template: "{primary}.mdx"
      field: create
    exclude:
      - modelo-projeto.mdx
    view:
      primary: title
      fields:
        - title
        - publishedAt
        - draft
        - featured
      sort:
        - publishedAt
        - title
      search:
        - title
        - description
        - tags
        - stack
      default:
        sort: publishedAt
        order: desc
    fields:
      - name: title
        label: Título
        type: string
        required: true
        options:
          maxlength: 160
      - name: description
        label: Descrição
        type: text
        required: true
        options:
          minlength: 20
          maxlength: 280
      - name: publishedAt
        label: Data de publicação
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: updatedAt
        label: Última atualização
        type: date
        default: ""
        options:
          format: yyyy-MM-dd
      - name: tags
        label: Tags
        type: string
        list: true
      - name: draft
        label: Rascunho
        type: boolean
        default: true
      - name: featured
        label: Projeto em destaque
        type: boolean
        default: false
      - name: role
        label: Papel no projeto
        type: string
      - name: stack
        label: Tecnologias
        type: string
        list: true
      - name: outcome
        label: Resultado
        type: text
      - name: repository
        label: Repositório
        type: string
        description: URL completa do repositório.
      - name: article
        label: Explicação técnica
        type: string
        description: URL do artigo que explica o projeto.
      - name: demo
        label: Demonstração
        type: string
        description: URL completa da demonstração.
      - name: body
        label: Conteúdo
        type: rich-text
        required: true
        options:
          format: markdown
          switcher: true

  - name: notes
    label: Pensamentos (MDX)
    type: collection
    path: src/content/notes
    format: yaml-frontmatter
    filename:
      template: "{primary}.mdx"
      field: create
    view:
      primary: title
      fields:
        - title
        - status
        - updatedAt
        - draft
      sort:
        - updatedAt
        - publishedAt
        - title
      search:
        - title
        - description
        - tags
      default:
        sort: updatedAt
        order: desc
    fields:
      - name: title
        label: Título
        type: string
        required: true
        options:
          maxlength: 160
      - name: description
        label: Descrição
        type: text
        required: true
        options:
          minlength: 20
          maxlength: 280
      - name: publishedAt
        label: Data de publicação
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: updatedAt
        label: Última atualização
        type: date
        default: ""
        options:
          format: yyyy-MM-dd
      - name: tags
        label: Tags
        type: string
        list: true
      - name: draft
        label: Rascunho
        type: boolean
        default: true
      - name: featured
        label: Pensamento em destaque
        type: boolean
        default: false
      - name: status
        label: Maturidade
        type: select
        default: seedling
        options:
          values:
            - name: seedling
              label: Semente
            - name: growing
              label: Crescendo
            - name: evergreen
              label: Maduro
      - name: body
        label: Conteúdo MDX
        type: code
        required: true
        description: Preserve imports e componentes Astro.
        options:
          format: mdx
